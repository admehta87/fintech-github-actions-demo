
name: Fintech Python CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify GitHub secret availability
        env:
          PAYMENT_API_KEY: ${{ secrets.DEMO_PAYMENT_API_KEY }}
          run: |
            if [ -n "$PAYMENT_API_KEY" ]; then
              echo "Payment API secret is configured."
            else
              echo "Payment API secret is missing."
              exit 1
            fi

      - name: Run automated tests
        run: |
          python -m pytest -v

      - name: Build Docker image
        run: |
          docker build -t fintech-ci-demo:1.0 .
